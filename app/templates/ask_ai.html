{% extends "base.html" %}
{% block content %}
<div class="chat-container glass-panel">

    <div class="chat-header">
        <div class="chat-header-info">
            <h2 class="chat-title">AI Crop Assistant</h2>
            <p class="chat-subtitle">Context: <strong>{{ detection.crop }}</strong> &bull; <span class="highlight-danger">{{ detection.disease }}</span></p>
        </div>
        <div class="chat-lang-picker">
            <label for="language-select" class="lang-label">🌐</label>
            <select id="language-select" class="lang-select">
                <option value="English">English</option>
                <option value="Hindi">Hindi</option>
                <option value="Marathi">Marathi</option>
                <option value="Telugu">Telugu</option>
                <option value="Tamil">Tamil</option>
                <option value="Kannada">Kannada</option>
            </select>
        </div>
    </div>

    <div id="chat-box" class="chat-box">
        <!-- Initial Bot Message -->
        <div class="message bot-message">
            Hi! I see you have detected <b>{{ detection.disease }}</b> on your <b>{{ detection.crop }}</b>. How can I assist you with this today?
        </div>
    </div>

    <form id="chat-form" class="chat-form">
        <input type="text" id="message-input" placeholder="Ask about causes, prevention, treatments..." required class="chat-input" autocomplete="off">
        <button type="submit" class="btn btn-primary chat-send-btn" id="send-btn">Send</button>
    </form>
</div>

<style>
    .chat-container {
        width: 100%;
        max-width: 800px;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        height: 75vh;
        max-height: 740px;
        min-height: 480px;
        box-sizing: border-box;
    }

    .chat-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 0.85rem;
        border-bottom: 1px solid var(--glass-border);
        padding-bottom: 0.85rem;
        gap: 0.75rem;
    }

    .chat-header-info {
        flex: 1;
        min-width: 0;
    }

    .chat-title {
        color: var(--primary-dark);
        font-size: 1.35rem;
        margin-bottom: 0.2rem;
        line-height: 1.25;
        font-weight: 700;
    }

    .chat-subtitle {
        font-size: 0.88rem;
        color: #555;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .chat-lang-picker {
        display: flex;
        align-items: center;
        gap: 0.35rem;
        background: rgba(255, 255, 255, 0.9);
        border: 1px solid rgba(0, 0, 0, 0.12);
        border-radius: 8px;
        padding: 0.35rem 0.6rem;
        flex-shrink: 0;
    }

    .lang-label {
        font-size: 1rem;
    }

    .lang-select {
        border: none;
        background: transparent;
        font-size: 0.85rem;
        font-weight: 500;
        cursor: pointer;
        outline: none;
        color: var(--text-dark);
    }

    .chat-box {
        flex: 1;
        overflow-y: auto;
        overflow-x: hidden;
        padding: 1rem;
        background: rgba(255, 255, 255, 0.5);
        border-radius: 12px;
        border: 1px solid rgba(0, 0, 0, 0.08);
        margin-bottom: 0.85rem;
        display: flex;
        flex-direction: column;
        gap: 0.85rem;
        box-sizing: border-box;
    }

    .message {
        padding: 0.85rem 1.1rem;
        border-radius: 14px;
        max-width: 82%;
        line-height: 1.5;
        font-size: 0.95rem;
        box-sizing: border-box;
        word-break: break-word;
        overflow-wrap: break-word;
    }

    .user-message {
        background-color: var(--primary);
        color: white;
        align-self: flex-end;
        border-bottom-right-radius: 4px;
        box-shadow: 0 2px 6px rgba(46, 125, 50, 0.25);
    }

    .bot-message {
        background-color: white;
        color: #222;
        align-self: flex-start;
        border-bottom-left-radius: 4px;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
    }

    .chat-form {
        display: flex;
        gap: 0.5rem;
        width: 100%;
        align-items: center;
        box-sizing: border-box;
    }

    .chat-input {
        flex: 1;
        min-width: 0; /* Ensures input does not cause horizontal overflow on mobile */
        padding: 0.8rem 1rem;
        border-radius: 10px;
        border: 1.5px solid #ccc;
        font-size: 0.95rem;
        background: rgba(255, 255, 255, 0.95);
        transition: border-color 0.2s, box-shadow 0.2s;
        box-sizing: border-box;
        outline: none;
    }

    .chat-input:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(46, 125, 50, 0.15);
    }

    .chat-send-btn {
        padding: 0.8rem 1.4rem;
        white-space: nowrap;
        flex-shrink: 0;
        border-radius: 10px;
        font-weight: 600;
        cursor: pointer;
    }

    @media (max-width: 768px) {
        .chat-container {
            height: calc(100vh - var(--bottom-nav-height) - 100px);
            min-height: 420px;
            padding: 1rem !important;
            border-radius: 14px;
        }

        .chat-title {
            font-size: 1.15rem;
        }

        .chat-subtitle {
            font-size: 0.8rem;
        }

        .chat-box {
            padding: 0.75rem;
            gap: 0.65rem;
        }

        .message {
            max-width: 88%;
            padding: 0.7rem 0.85rem;
            font-size: 0.9rem;
        }

        .chat-send-btn {
            padding: 0.75rem 1rem;
        }
    }
</style>

<script>
    const chatForm = document.getElementById('chat-form');
    const messageInput = document.getElementById('message-input');
    const chatBox = document.getElementById('chat-box');
    const sendBtn = document.getElementById('send-btn');

    chatForm.addEventListener('submit', async (e) => {
        e.preventDefault();

        const userMsg = messageInput.value.trim();
        if (!userMsg) return;

        // Append User Message
        appendMessage(userMsg, 'user-message');
        messageInput.value = '';

        // Disable input while fetching
        messageInput.disabled = true;
        sendBtn.disabled = true;

        // Add loading indicator
        const loadingId = appendMessage("Thinking...", 'bot-message');

        try {
            const formData = new FormData();
            formData.append('message', userMsg);
            formData.append('language', document.getElementById('language-select').value);

            const response = await fetch("{{ url_for('ai.ask_ai', detection_id=detection._id) }}", {
                method: 'POST',
                body: formData
            });

            const data = await response.json();

            // Replace loading with actual response
            document.getElementById(loadingId).innerHTML = data.reply.replace(/\n/g, '<br>');

        } catch (err) {
            document.getElementById(loadingId).innerHTML = "Sorry, an error occurred while connecting to the AI.";
        }

        // Re-enable
        messageInput.disabled = false;
        sendBtn.disabled = false;
        messageInput.focus();
    });

    function appendMessage(text, className) {
        const div = document.createElement('div');
        div.className = `message ${className}`;
        const id = 'msg-' + Date.now() + '-' + Math.floor(Math.random() * 10000);
        div.id = id;
        div.innerHTML = text;
        chatBox.appendChild(div);
        chatBox.scrollTop = chatBox.scrollHeight;
        return id;
    }
</script>
{% endblock %}
